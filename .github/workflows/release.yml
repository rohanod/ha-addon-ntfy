name: Publish ntfy app release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntfy-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tests, app metadata and release script
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/appctl.py validate
          bash -n scripts/publish-release.sh
          sh -n ntfy/run.sh
      - name: Verify app image
        run: scripts/smoke.sh amd64
      - name: Tag and publish current app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "$(git rev-parse HEAD)"
